name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/plaid-api/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r apps/plaid-api/requirements-dev.txt
      - run: npm run check
